services:
  postgres:
    image: postgres:16-alpine
    container_name: gmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gmp_copilot
      POSTGRES_USER: gmp_user
      POSTGRES_PASSWORD: ${DB_PASS:-gmp_pass}
    volumes:
      - gmp_postgres_data:/var/lib/postgresql/data
      - ./scripts/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmp_user -d gmp_copilot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gmp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gmp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      DATABASE_URL: postgresql://gmp_user:${DB_PASS:-gmp_pass}@postgres:5432/gmp_copilot
      REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - /home/ing_cpmo/.cache/chroma:/root/.cache/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  gmp_postgres_data:
  gmp_redis_data:
