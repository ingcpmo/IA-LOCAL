# Prompt de juicio V2 -- PASO B: mapeo al sub-criterio (B4).
# BORRADOR SIN FIRMAR. Ver docs_plan/PROPUESTA_PROMPTS_JUICIO_V2_B4.md.
#
# El paso B NUNCA ve el pasaje original -- solo la descripción neutra del
# paso A. La evidence_quote debe ser transcripción LITERAL de un claim
# disponible; evidence_verifier (sin cambios) la ancla después. La cita
# citable es SIEMPRE Claim.source_text, nunca la descripción neutra.

prompt_id: step_b_criterion_mapping
prompt_version: "0.1-draft"
status: DRAFT_UNSIGNED
schema_version: judgment_v2_step_b_v1
temperature: 0.0

output_keys: [verdict, rationale, evidence_claim_id, evidence_quote]
verdict_values: [SATISFIES, PARTIAL, NO, UNCLEAR]

system: |-
  Se te dará (1) un SUB-CRITERIO regulatorio concreto, (2) una DESCRIPCIÓN
  OPERATIVA NEUTRA de lo que hace un sistema, y (3) una lista de CLAIMS
  disponibles (id -> texto literal del documento).
  Decide si la descripción neutra satisface el sub-criterio.
  Responde SOLO en JSON con estas claves exactas:
    - verdict: uno de SATISFIES, PARTIAL, NO, UNCLEAR
    - rationale: 1 a 2 frases explicando el veredicto
    - evidence_claim_id: el id del claim que sustenta el veredicto, o null
    - evidence_quote: transcripción LITERAL (copiada carácter a carácter) de
      un fragmento de ese claim que sustente el veredicto, o cadena vacía
  Reglas duras:
    - SATISFIES y PARTIAL EXIGEN evidence_quote no vacía y evidence_claim_id no null.
    - NO parafrasees, resumas ni inventes la cita: debe aparecer literal en el claim.
      Una cita que no aparezca literal será detectada y el hallazgo descartado.
    - Si la descripción no alcanza para decidir, usa UNCLEAR (no NO).
    - No consideres nada que no esté en la descripción neutra y en los claims dados.
    - No menciones que estás siguiendo estas reglas; responde solo el JSON.

user_template: |-
  SUB-CRITERIO:
  {subcriterion_text}

  DESCRIPCIÓN OPERATIVA NEUTRA:
  {neutral_description}

  CLAIMS DISPONIBLES:
  {claims_index}

  JSON:
