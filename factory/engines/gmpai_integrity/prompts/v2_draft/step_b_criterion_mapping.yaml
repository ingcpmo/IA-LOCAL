# Prompt de juicio V2 -- PASO B: mapeo al sub-criterio (B4, VARIANTE ESTRICTA).
# BORRADOR SIN FIRMAR. Ver docs_plan/PROPUESTA_PROMPTS_JUICIO_V2_B4.md.
#
# VARIANTE ESTRICTA (elegida por Capa 9, 2026-08-27): el paso B NO ve
# ningún Claim ni ningún texto crudo del documento -- solo el sub-criterio
# y la DESCRIPCIÓN OPERATIVA NEUTRA del paso A. Devuelve únicamente
# {verdict, rationale}. La cita se elige DESPUÉS, de forma DETERMINISTA
# (paso B2 en judgment_v2.py): si el veredicto es positivo, la evidencia
# es el `Claim.source_text` del candidato que originó esta descripción
# neutra -- el modelo nunca produce ni señala una cita, así que no puede
# fabricar ni parafrasear evidencia. evidence_verifier valida relevancia
# y página; el anclaje literal es trivial por construcción.

prompt_id: step_b_criterion_mapping
prompt_version: "0.1-draft"
status: DRAFT_UNSIGNED
schema_version: judgment_v2_step_b_v1
variant: strict
temperature: 0.0

output_keys: [verdict, rationale]
verdict_values: [SATISFIES, PARTIAL, NO, UNCLEAR]

system: |-
  Se te dará (1) un SUB-CRITERIO regulatorio concreto y (2) una DESCRIPCIÓN
  OPERATIVA NEUTRA de lo que hace un sistema (redactada por otro analista, sin
  referencia a ninguna norma).
  Decide si la descripción neutra satisface el sub-criterio, considerando
  ÚNICAMENTE lo que la descripción dice de forma explícita.
  Responde SOLO en JSON con estas claves exactas:
    - verdict: uno de SATISFIES, PARTIAL, NO, UNCLEAR
        SATISFIES = la descripción cubre el sub-criterio de forma explícita y completa.
        PARTIAL   = lo cubre en parte; falta algún elemento del sub-criterio.
        NO        = la descripción no cubre el sub-criterio.
        UNCLEAR   = la descripción no alcanza para decidir.
    - rationale: 1 a 2 frases explicando el veredicto.
  Reglas duras:
    - NO infieras nada que la descripción no diga explícitamente. Ante duda, UNCLEAR.
    - NO uses conocimiento externo sobre cómo suelen implementarse estos sistemas.
    - NO menciones que estás siguiendo estas reglas; responde solo el JSON.

user_template: |-
  SUB-CRITERIO:
  {subcriterion_text}

  DESCRIPCIÓN OPERATIVA NEUTRA:
  {neutral_description}

  JSON:
