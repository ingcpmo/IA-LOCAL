agent_id: fda_part11_agent
prompt_version: "1.1.0"
schema_version: "checkpoint_llm_response_v1"
base_agent: integrity
profile_name: integrity_part11_ot_profile
verifier_version: "1.0.0"  # verificador local de anclaje de evidencia (ollama_verifier.py), no el 2.2 de W7 (dominio distinto)

changelog:
  - version: "1.0.0"
