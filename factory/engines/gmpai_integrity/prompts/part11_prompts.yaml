# CONFIGURACION GxP (mismo regimen que factory/agent_prompts/*.yaml): cualquier
# cambio de texto exige bump de version + changelog + suite verde + aprobacion
# humana. El sha256 declarado es recomputado por tests/test_part11_prompts.py
