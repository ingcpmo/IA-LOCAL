# Registro de FAMILIAS DE DECISION — W5 V2, G1.1
#
# Fuente unica de verdad de que familias de decision existen. Vive aqui, en
# factory/registry/, junto a ports.yaml y agents_catalog.yaml, porque es un
# dato declarativo de la fabrica, no logica.
#
# REGLA DURA: agregar una familia o un adendo NUNCA requiere tocar una tupla
# de codigo. Si una fase futura propone "añadir un nombre a DECISION_IDS",
# esa fase esta mal disenada -- ese es exactamente el defecto que este
# archivo existe para cerrar (ver GOVERNANCE_STATE_AUDIT.md A-2/A-3 y
# EXTENSIBLE_DECISION_MODEL_SPEC.md §1-2).
#
# D1-A, D2-A y D4-A NO aparecen aqui a proposito: no son familias, son
# ADDENDUM de D1, D2 y D4 (decision_type=ADDENDUM, amendment_sequence>0).
# Modelar cada adendo como familia propia es como se llego a la tupla
# cerrada.
#
# `consumers` NO es documentacion: factory/tests/test_decision_resolver_no_bypass.py
# lo lee y falla si un consumidor declarado aqui no llama al resolver.

registry_version: 1

# Consumidores validos. Un `consumers:` que nombre algo fuera de esta lista
# es un error de configuracion (fail-closed en load_families()).
known_consumers:
  - source_reverification
  - source_lifecycle_transition
  - source_registration_apply
  - evidence_pack_eligibility
  - corpus_planner
  - corpus_runner
  - run_driver
  - formal_baseline
  - release_gate
  - applicability_resolution
  - version_guard
  - model_qualification_gate
  - audit_reporting
  - package_regeneration
  - pilot_runner
  - embedding_runner
  - remediation_package_creation
  - remediation_directive_creation

families:

  D1:
    label: "Fuentes regulatorias — cadencia y autoridad de reverificacion"
    target_kind: source_id
    target_registry: factory/regulatory/sources/registry.json
    target_registry_id_path: "sources[].source_id"
    selection_modes: [EXPLICIT_LIST, ALL_SNAPSHOT]
    consumers: [source_reverification, source_lifecycle_transition]
    requires_human_confirmation: true
    legacy_w5_decision_id: D1_regulatory_sources

  D2:
    label: "Evidence Packs — criterios interpretativos"
    target_kind: requirement_id
    target_registry: factory/regulatory/requirement_catalog/requirements.yaml
    target_registry_id_path: "requirements{}"
    # ALL_SNAPSHOT PROHIBIDO a proposito: cada pack se aprueba por su
    # contenido concreto. Un "apruebo todos" es lo que produjo el registro
    # D2_evidence_packs sin ningun objetivo (ver G2' del plan).
    selection_modes: [EXPLICIT_LIST]
    consumers: [evidence_pack_eligibility, corpus_planner, formal_baseline]
    requires_human_confirmation: true
    legacy_w5_decision_id: D2_evidence_packs

  D3:
    label: "Clasificacion documental (T-039 y sucesores)"
    target_kind: document_id
    target_registry: factory/regulatory/scope/source_baseline_allowlist.yaml
    # El allowlist es una LISTA plana de entradas y el identificador se llama
    # `file_id` (RW-NNNN), no `document_id`. G1.10 lo corrigio contra el
    # artefacto real: el valor anterior ("documents[].document_id") describia
    # una estructura que no existe, y coverage_report(D3) habria fallado en
    # silencio al resolverla.
    target_registry_id_path: "[].file_id"
    selection_modes: [EXPLICIT_LIST]
    consumers: [corpus_planner]
    requires_human_confirmation: true
    legacy_w5_decision_id: D3_T039

  D4:
    label: "Ejecucion de corpus — presupuesto y limites duros"
    target_kind: run_scope
    # Sin target_registry: el objetivo es un plan de corrida, no un id que
    # viva en un registry. coverage_report() lo declara N/A en vez de
    # inventar un conjunto contra el que comparar.
    target_registry: null
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [corpus_planner, run_driver]
    requires_human_confirmation: true
    legacy_w5_decision_id: D4_corpus_execution

  CORPUS_AUTHORIZATION:
    label: "Autorizacion de corpus -- go/no-go atado a fingerprint (plan Bloque 6)"
    target_kind: run_scope
    # Igual que D4: el objetivo es un plan de corrida, no un id que viva en
    # un registry.
    target_registry: null
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [corpus_runner]
    requires_human_confirmation: true
    # Distinta de D4 (presupuesto/limites duros): D4 dice CUANTO cuesta;
    # esta dice SI se ejecuta, atada al fingerprint EXACTO de configuracion
    # (catalog_sha256, prompt_versions, model_digest, golden_dataset_sha256)
    # -- spec MODEL_REQUALIFICATION_AND_D4A_SPEC.md Sec 6: "toda corrida
    # queda atada a un run_fingerprint que incluye catalog_sha256". Un
    # cambio de cualquier campo del fingerprint tras esta firma invalida la
    # autorizacion -- no se hereda, igual que la calificacion del modelo.

  PILOT_EXECUTION:
    label: "Autorizacion LIGERA de un piloto de diagnostico pre-corpus -- nunca autoriza el corpus formal ni promueve el baseline"
    target_kind: run_scope
    # Igual que D4/CORPUS_AUTHORIZATION: el objetivo es un plan de corrida
    # acotado (documentos+agentes+requisitos del piloto), no un id que viva
    # en un registry.
    target_registry: null
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [pilot_runner]
    requires_human_confirmation: true
    # Distinta de D4/CORPUS_AUTHORIZATION a proposito: esta familia NUNCA
    # cubre CORPUS_AUTHORIZATION ni D4 (el resolver de esas dos familias no
    # las consulta), asi que firmar un PILOT_EXECUTION no puede, ni por
    # accidente, satisfacer la cobertura que exige la corrida formal --
    # ver PLAN_PILOTO_DIAGNOSTICO_PRECORPUS.md Sec 2 y
    # test_pilot_isolation.py.

  EMBED_EXECUTION:
    label: "Autorizacion LIGERA de llamadas de EMBEDDING (vectores deterministas, no juicio LLM) para medir recuperacion semantica -- nunca autoriza PILOT_EXECUTION, CORPUS_AUTHORIZATION ni D4"
    target_kind: run_scope
    # Mismo patron que PILOT_EXECUTION: el objetivo es un plan de corrida
    # acotado (documentos + fixture), no un id que viva en un registry.
    target_registry: null
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [embedding_runner]
    requires_human_confirmation: true
    # R2.2 §4.2 (2026-08-10, docs_plan/R2_2_CIERRE_Y_CAPA_SEMANTICA.md):
    # familia NUEVA, distinta de PILOT_EXECUTION a proposito -- un embedding
    # (vector determinista de un input, sin texto generado ni conclusion)
    # NO es juicio LLM ni gasta el presupuesto de recall que mide si el
    # MODELO DE JUICIO reconoce evidencia. Mezclar los dos conteos
    # ocultaria cuanto presupuesto de juicio real queda disponible. Esta
    # familia NUNCA cubre PILOT_EXECUTION/CORPUS_AUTHORIZATION/D4 (el
    # resolver de esas familias no la consulta) -- firmar un
    # EMBED_EXECUTION no autoriza, ni por accidente, ninguna llamada de
    # juicio.

  D5:
    label: "Regeneracion de paquetes QA"
    target_kind: package_id
    target_registry: factory/remediation_packages/
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [package_regeneration]
    requires_human_confirmation: true
    legacy_w5_decision_id: D5_regenerate_qa_package
    # R4-T1 (2026-08-12, docs_plan/R4_T1_PLAN_POR_FASES.md): D5 NO cubre
    # la primera generacion de un paquete -- ver REMEDIATION_PACKAGE_GENERATION
    # abajo. D5 no tiene target_registry (igual que D4), asi que
    # tecnicamente se podria firmar para un package_id que aun no existe --
    # pero su etiqueta ("Regeneracion") y su unico precedente historico
    # (D5_regenerate_qa_package, una correccion real de un paquete ya
    # existente) documentan que YA HABIA un paquete y se corrigio. Usarlo
    # para una primera publicacion dejaria un rastro de auditoria enganoso
    # (un auditor futuro leeria "Regeneracion" sobre lo que en realidad fue
    # la primera vez). Mismo criterio ya aplicado para separar
    # EMBED_EXECUTION de PILOT_EXECUTION: acciones semanticamente distintas
    # no comparten familia aunque el mecanismo de resolucion sea identico.

  REMEDIATION_DIRECTIVE_AUTHORSHIP:
    label: "Autoria humana de una directiva de remediacion sobre un hallazgo confirmado"
    target_kind: finding_rc_id
    target_registry: null
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [remediation_directive_creation]
    requires_human_confirmation: true
    # R4-T1.1v2 §4.1 (2026-08-13, docs_plan/R4_T1_1v2_DESBLOQUEO_Y_VALIDACION_FRIA.md):
    # familia NUEVA -- propose_remediation_directive() (remediation_directive.py)
    # hoy no consulta ninguna familia de gobernanza (verificado leyendo el
    # modulo: cero resolver.resolve(...) ahi). REMEDIATION_PACKAGE_GENERATION
    # no la cubre: target_kind=package_id, consumidor=remediation_package_creation
    # -- una directiva no tiene package_id (existe antes del paquete, antes
    # del dispatch). La directiva es el acto de autoria humana; REMEDIATION_
    # PACKAGE_GENERATION es la generacion automatica posterior -- nunca
    # comparten familia (mismo criterio ya usado arriba para separar
    # EMBED_EXECUTION de PILOT_EXECUTION y D5 de REMEDIATION_PACKAGE_GENERATION).

  REMEDIATION_PACKAGE_GENERATION:
    label: "Primera generacion de un paquete de remediacion (borrador controlado, nunca liberado)"
    target_kind: package_id
    target_registry: null
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [remediation_package_creation]
    requires_human_confirmation: true
    # R4-T1 (2026-08-12): familia NUEVA, mecanicamente igual a D5 (mismo
    # target_kind, misma exigencia de confirmacion humana) pero para la
    # PRIMERA generacion de un paquete -- nunca una regeneracion (eso sigue
    # siendo D5, sin cambios). Firmar esta familia NUNCA autoriza, ni por
    # accidente, `create_release_record()` -- el endpoint de release sigue
    # sin exponerse, PRODUCTION_ENABLEMENT sigue BLOCKED
    # independientemente de esta firma. Su consumidor
    # (`remediation_package_creation`) debe cablearse en R4-T1.0 -- a
    # diferencia de `package_regeneration` (D5), que hoy es deuda tecnica
    # declarada y sin cablear (ver test_t24_declared_consumers_have_a_wired_module,
    # xfail), esta familia nace ya consumida por el resolver real, no se
    # suma a esa lista de deuda.

  SOURCE_REGISTRATION:
    label: "Alta de fuente regulatoria en el registry"
    target_kind: source_id
    target_registry: factory/regulatory/sources/registry.json
    target_registry_id_path: "sources[].source_id"
    selection_modes: [EXPLICIT_LIST]
    consumers: [source_registration_apply]
    requires_human_confirmation: true
    # Sistema A: esta familia YA tiene enforcement real hoy
    # (human_source_registration.apply_source_registration l.212-222).
    legacy_action: regulatory_source_registration

  APPLICABILITY_MATRIX:
    label: "Aprobacion de la matriz de aplicabilidad documental"
    target_kind: matrix_version
    target_registry: factory/regulatory/applicability_matrix.yaml
    target_registry_id_path: "matrix_version"
    selection_modes: [EXPLICIT_LIST]
    consumers: [applicability_resolution, corpus_planner]
    requires_human_confirmation: true
    legacy_action: w5v2_applicability_matrix_approval

  ARTIFACT_VERSION:
    label: "Aprobacion de una version de artefacto gobernado"
    target_kind: artifact_id
    target_registry: null
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [version_guard, model_qualification_gate, release_gate]
    requires_human_confirmation: true

  AUDIT_EXCEPTION:
    label: "Excepcion humana sobre una anomalia de la cadena de auditoria"
    target_kind: audit_event_id
    target_registry: factory/audit/factory_audit.jsonl
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: [audit_reporting, release_gate]
    requires_human_confirmation: true

  SOURCE_CURRENCY:
    label: "Confirmacion de vigencia regulatoria de una fuente (G3)"
    target_kind: source_id
    target_registry: factory/regulatory/sources/registry.json
    target_registry_id_path: "sources[].source_id"
    # ALL_SNAPSHOT PROHIBIDO a proposito, mismo criterio que D2: cada fuente
    # se confirma por su propia evidencia real (source_currency_log.jsonl),
    # nunca "confirmo todas de una".
    selection_modes: [EXPLICIT_LIST]
    consumers: [source_lifecycle_transition]
    requires_human_confirmation: true

  SOURCE_ORIGIN_VERIFICATION:
    label: "Confirmacion de que una segunda reingesta real coincide con el origen (G3)"
    target_kind: source_id
    target_registry: factory/regulatory/sources/registry.json
    target_registry_id_path: "sources[].source_id"
    # Distinta de SOURCE_CURRENCY: esa declara VIGENCIA NORMATIVA (juicio
    # regulatorio sobre si la norma sigue aplicando hoy); esta declara
    # PROCEDENCIA DEL ARCHIVO (que existe un segundo punto de comparacion
    # real en el tiempo contra el mismo origen oficial, el dato que
    # source_lifecycle.py exige para dejar de ser NOT_COMPARABLE_FIRST_INGESTION).
    # Mismo criterio ALL_SNAPSHOT prohibido: cada fuente por su propia
    # evidencia real de source_currency_log.jsonl.
    selection_modes: [EXPLICIT_LIST]
    consumers: [source_lifecycle_transition]
    requires_human_confirmation: true

  # Anotacion sobre el propio registro. Existe porque el almacen es
  # append-only: cuando un defecto de software deja basura en el registro de
  # registros, la unica forma honesta de explicarla es AÑADIR la explicacion,
  # no limpiarla. Un auditor que encuentre 32 correcciones D1 sin firmar y 3
  # ids duplicados tiene derecho a encontrar tambien la causa, fechada y en el
  # mismo fichero.
  #
  # `never_authorizes` + `consumers: []` la hacen inerte por construccion: el
  # resolver la deniega antes de leer ningun registro. Una anotacion que
  # pudiera otorgar algo seria una puerta trasera con nombre de comentario.
  # Por eso tampoco exige confirmacion humana: no pide permiso, constata.
  RECORD_ANNOTATION:
    label: "Anotacion sobre el registro de decisiones — explica, no autoriza"
    target_kind: decision_instance_id
    target_registry: factory/layer9/decisions/decisions_v2.jsonl
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: []
    requires_human_confirmation: false
    never_authorizes: true

  # Cajon explicito para las decisiones historicas del Sistema A que NO son
  # de gobernanza del corpus (deploy, agent_design, resolucion de
  # contradicciones de un documento concreto). Se proyectan para poder
  # LEERLAS; nunca autorizan nada. Forzarlas a una familia real seria
  # fabricar cobertura.
  LEGACY_UNMAPPED:
    label: "Decision historica sin familia de gobernanza equivalente"
    target_kind: none
    target_registry: null
    target_registry_id_path: null
    selection_modes: [EXPLICIT_LIST]
    consumers: []
    requires_human_confirmation: true
    never_authorizes: true
