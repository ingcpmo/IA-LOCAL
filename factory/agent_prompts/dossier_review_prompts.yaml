# W6.5 — Prompts expertos gobernados para Agent Expert Review & Drafting.
#
# CONFIGURACIÓN GxP: este archivo es propiedad de la Factory (separado del
# deployment). Cualquier cambio de texto exige bump de versión + changelog +
# suite verde + aprobación humana. Los sha256 declarados son recomputados por
# tests/test_dossier_agent_prompts.py — editar sin bump rompe la suite.
#
# El placeholder {corpus_sufficiency} del contrato común se sustituye en
# generación con el nivel determinista del gate de corpus (§4 del diseño).

