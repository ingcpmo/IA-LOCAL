<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMP AI Factory — Consola</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
  header{background:#1e293b;border-bottom:1px solid #334155;padding:16px 24px;display:flex;align-items:center;gap:16px}
  header h1{font-size:1.2rem;font-weight:700;color:#f1f5f9}
  header .badge{background:#0284c7;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:9999px;font-weight:600}
  .key-bar{background:#1e293b;border-bottom:1px solid #334155;padding:10px 24px;display:flex;align-items:center;gap:12px}
  .key-bar label{font-size:.8rem;color:#94a3b8;white-space:nowrap}
  .key-bar input{flex:1;max-width:360px;background:#0f172a;border:1px solid #475569;border-radius:6px;padding:6px 10px;color:#e2e8f0;font-size:.85rem;font-family:monospace}
  .key-bar .status{font-size:.8rem;color:#94a3b8}
  .key-bar .status.ok{color:#22c55e}
  .key-bar .status.err{color:#ef4444}
  nav{background:#1e293b;padding:0 24px;display:flex;gap:4px;border-bottom:1px solid #334155}
  nav button{background:none;border:none;color:#94a3b8;padding:12px 16px;cursor:pointer;font-size:.85rem;border-bottom:2px solid transparent;transition:all .15s}
  nav button.active,nav button:hover{color:#f1f5f9;border-bottom-color:#0284c7}
  .container{padding:24px;max-width:1100px}
  .section{display:none}.section.active{display:block}
  h2{font-size:1rem;font-weight:600;color:#f1f5f9;margin-bottom:16px}
  .card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:16px;margin-bottom:12px}
  .card h3{font-size:.9rem;font-weight:600;color:#f1f5f9;margin-bottom:8px}
  .card p,.card .meta{font-size:.8rem;color:#94a3b8;margin-bottom:4px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  input,textarea,select{background:#0f172a;border:1px solid #475569;border-radius:6px;padding:8px 12px;color:#e2e8f0;font-size:.85rem;width:100%}
  textarea{resize:vertical;min-height:80px;font-family:monospace}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:.85rem;font-weight:500;transition:all .15s}
  .btn-primary{background:#0284c7;color:#fff}.btn-primary:hover{background:#0369a1}
  .btn-success{background:#16a34a;color:#fff}.btn-success:hover{background:#15803d}
  .btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
  .btn-sm{padding:4px 10px;font-size:.75rem}
  .tag{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:.7rem;font-weight:600}
  .tag-blue{background:#1e40af;color:#93c5fd}
  .tag-green{background:#14532d;color:#86efac}
  .tag-yellow{background:#78350f;color:#fcd34d}
  .tag-red{background:#7f1d1d;color:#fca5a5}
  .tag-gray{background:#334155;color:#94a3b8}
  pre{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:12px;font-size:.75rem;overflow:auto;max-height:400px;color:#94a3b8}
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:.8rem;color:#94a3b8;margin-bottom:4px}
  .empty{color:#475569;font-size:.85rem;text-align:center;padding:32px}
  .gate-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1e293b;font-size:.8rem}
  .gate-row:last-child{border:none}
  .gate-id{font-family:monospace;color:#94a3b8;width:40px;flex-shrink:0}
  .gate-ev{color:#64748b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #toast{position:fixed;bottom:24px;right:24px;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:12px 20px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
  #toast.show{opacity:1}
  #toast.ok{border-color:#22c55e;color:#86efac}
  #toast.err{border-color:#ef4444;color:#fca5a5}
</style>
</head>
<body>

<header>
  <h1>⚗️ GMP AI Factory</h1>
  <span class="badge">Capas 7-9</span>
  <span style="flex:1"></span>
  <span id="health-dot" style="font-size:.8rem;color:#475569">● desconectado</span>
</header>

<div class="key-bar">
  <label>Factory API Key:</label>
  <input type="password" id="api-key" placeholder="Ingresar key (no se persiste)" oninput="onKeyChange()">
  <span class="status" id="key-status">sin key</span>
</div>

<nav>
  <button class="active" onclick="showTab('projects')">Proyectos</button>
  <button onclick="showTab('workspaces')">Workspaces</button>
  <button onclick="showTab('gates')">Quality Gates</button>
  <button onclick="showTab('approvals')">Aprobaciones</button>
  <button onclick="showTab('audit')">Auditoría</button>
</nav>

<div class="container">

<!-- PROYECTOS -->
<div id="tab-projects" class="section active">
  <h2>Proyectos</h2>
  <div class="card">
    <h3>Nuevo proyecto</h3>
    <div class="row">
      <div class="form-group" style="flex:1">
        <label>ID (snake_case)</label>
        <input id="p-id" placeholder="lab_qc_project">
      </div>
      <div class="form-group" style="flex:2">
        <label>Nombre</label>
        <input id="p-name" placeholder="Laboratorio QC">
      </div>
    </div>
    <div class="form-group">
      <label>Descripción</label>
      <input id="p-desc" placeholder="Descripción breve del proyecto">
    </div>
    <button class="btn btn-primary" onclick="createProject()">+ Crear proyecto</button>
  </div>
  <div id="projects-list"></div>
</div>

<!-- WORKSPACES -->
<div id="tab-workspaces" class="section">
  <h2>Workspaces</h2>
  <div class="card">
    <h3>Crear workspace</h3>
    <div class="row">
      <div class="form-group" style="flex:1">
        <label>Project ID</label>
        <input id="w-pid" placeholder="lab_qc_project">
      </div>
      <div class="form-group" style="flex:1">
        <label>Base tag</label>
        <input id="w-tag" value="base-v1.0.0">
      </div>
    </div>
    <div class="form-group">
      <label>Requerimiento</label>
      <textarea id="w-req" placeholder="Descripción del requerimiento para este workspace..."></textarea>
    </div>
    <button class="btn btn-primary" onclick="createWorkspace()">+ Crear workspace</button>
  </div>
  <div id="workspaces-list"></div>
</div>

<!-- QUALITY GATES -->
<div id="tab-gates" class="section">
  <h2>Quality Gates</h2>
  <div class="card">
    <label style="font-size:.8rem;color:#94a3b8;display:block;margin-bottom:8px">Project ID del workspace</label>
    <div class="row" style="align-items:flex-end;gap:8px">
      <input id="g-pid" placeholder="lab_qc_project" style="flex:1">
      <button class="btn btn-primary" onclick="loadGates()">Cargar reporte</button>
    </div>
  </div>
  <div id="gates-report"></div>
</div>

<!-- APROBACIONES -->
<div id="tab-approvals" class="section">
  <h2>Aprobaciones</h2>
  <div class="card">
    <h3>Nueva aprobación</h3>
    <div class="row">
      <div class="form-group" style="flex:1">
        <label>Project ID</label>
        <input id="a-pid" placeholder="lab_qc_project">
      </div>
      <div class="form-group" style="flex:1">
        <label>Acción</label>
        <input id="a-action" placeholder="release_v0.1.0">
      </div>
    </div>
    <div class="form-group">
      <label>Notas</label>
      <input id="a-notes" placeholder="Observaciones de Capa 9">
    </div>
    <div class="row">
      <button class="btn btn-success" onclick="postApproval('approve')">✓ Aprobar</button>
      <button class="btn btn-danger" onclick="postApproval('reject')">✗ Rechazar</button>
    </div>
  </div>
  <div id="approvals-list"></div>
</div>

<!-- AUDITORÍA -->
<div id="tab-audit" class="section">
  <h2>Auditoría de Fábrica</h2>
  <div style="display:flex;gap:8px;margin-bottom:16px">
    <button class="btn btn-primary" onclick="loadAudit()">Verificar cadena</button>
  </div>
  <div id="audit-result"></div>
</div>

</div><!-- /container -->
<div id="toast"></div>

<script>
let apiKey = '';

function getKey(){ return document.getElementById('api-key').value.trim(); }
function headers(){ return {'Content-Type':'application/json','X-Api-Key':getKey()}; }

function showTab(name){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  event.target.classList.add('active');
  if(name==='projects') loadProjects();
  if(name==='workspaces') loadWorkspaces();
  if(name==='approvals') loadAllApprovals();
}

function toast(msg, type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show '+type;
  setTimeout(()=>t.className='',2500);
}

function onKeyChange(){
  const k=getKey();
  const el=document.getElementById('key-status');
  el.textContent=k?'key ingresada':'sin key';
  el.className='status '+(k?'ok':'');
  if(k) checkHealth();
}

async function checkHealth(){
  try{
    const r=await fetch('/health');
    const d=await r.json();
    document.getElementById('health-dot').textContent='● '+d.api;
    document.getElementById('health-dot').style.color='#22c55e';
  }catch(e){
    document.getElementById('health-dot').textContent='● error';
    document.getElementById('health-dot').style.color='#ef4444';
  }
}

async function api(method,path,body){
  const opts={method,headers:headers()};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  const data=await r.json().catch(()=>({detail:r.statusText}));
  if(!r.ok) throw new Error(data.detail||r.statusText);
  return data;
}

// ── Proyectos ────────────────────────────────────────────────────────────────

async function loadProjects(){
  try{
    const ps=await api('GET','/api/v1/projects');
    const el=document.getElementById('projects-list');
    if(!ps.length){el.innerHTML='<div class="empty">Sin proyectos</div>';return;}
    el.innerHTML=ps.map(p=>`
      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <h3>${p.name}</h3>
          <span class="tag tag-blue">${p.id}</span>
          <span class="tag ${p.status==='active'?'tag-green':'tag-gray'}">${p.status}</span>
        </div>
        <p>${p.description||''}</p>
        <p class="meta">Creado: ${p.created_at?.slice(0,19).replace('T',' ')}</p>
        ${p.requirements?.length?`<p class="meta">${p.requirements.length} requerimiento(s)</p>`:''}
        <div style="margin-top:10px;display:flex;gap:8px">
          <input id="req-${p.id}" placeholder="Agregar requerimiento..." style="flex:1;font-size:.8rem;padding:6px">
          <button class="btn btn-primary btn-sm" onclick="addReq('${p.id}')">+ Req</button>
        </div>
      </div>`).join('');
  }catch(e){toast(e.message,'err');}
}

async function createProject(){
  const id=document.getElementById('p-id').value.trim();
  const name=document.getElementById('p-name').value.trim();
  const desc=document.getElementById('p-desc').value.trim();
  if(!id||!name){toast('ID y nombre son requeridos','err');return;}
  try{
    await api('POST','/api/v1/projects',{id,name,description:desc});
    toast('Proyecto creado');
    document.getElementById('p-id').value='';
    document.getElementById('p-name').value='';
    document.getElementById('p-desc').value='';
    loadProjects();
  }catch(e){toast(e.message,'err');}
}

async function addReq(pid){
  const text=document.getElementById('req-'+pid).value.trim();
  if(!text){toast('Ingresa el requerimiento','err');return;}
  try{
    await api('POST',`/api/v1/projects/${pid}/requirements`,{text});
    toast('Requerimiento registrado');
    document.getElementById('req-'+pid).value='';
    loadProjects();
  }catch(e){toast(e.message,'err');}
}

// ── Workspaces ───────────────────────────────────────────────────────────────

async function loadWorkspaces(){
  try{
    const ws=await api('GET','/api/v1/workspaces');
    const el=document.getElementById('workspaces-list');
    if(!ws.length){el.innerHTML='<div class="empty">Sin workspaces</div>';return;}
    el.innerHTML=ws.map(w=>`
      <div class="card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <h3>${w.project_id}</h3>
          <span class="tag ${w.has_approval?'tag-green':'tag-yellow'}">${w.has_approval?'aprobado':'pendiente'}</span>
          ${w.has_gates_report?'<span class="tag tag-blue">gates OK</span>':''}
        </div>
        <p class="meta">Archivos: ${w.files} | API: :${w.ports?.api} | PG: :${w.ports?.postgres} | Redis: :${w.ports?.redis}</p>
        <p class="meta">Compose: ${w.has_compose?'✓':'✗'} | task.md: ${w.has_task_md?'✓':'✗'} | Estado: ${w.manifest_status}</p>
      </div>`).join('');
  }catch(e){toast(e.message,'err');}
}

async function createWorkspace(){
  const pid=document.getElementById('w-pid').value.trim();
  const tag=document.getElementById('w-tag').value.trim()||'base-v1.0.0';
  const req=document.getElementById('w-req').value.trim();
  if(!pid){toast('Project ID requerido','err');return;}
  toast('Creando workspace… puede tardar unos segundos');
  try{
    const r=await api('POST','/api/v1/workspaces',{project_id:pid,base_tag:tag,requirement:req});
    toast(`Workspace creado: api=:${r.ports?.api}`);
    document.getElementById('w-pid').value='';
    document.getElementById('w-req').value='';
    loadWorkspaces();
  }catch(e){toast(e.message,'err');}
}

// ── Quality Gates ─────────────────────────────────────────────────────────────

async function loadGates(){
  const pid=document.getElementById('g-pid').value.trim();
  if(!pid){toast('Project ID requerido','err');return;}
  try{
    const ws=await api('GET',`/api/v1/workspaces/${pid}`);
    if(!ws.has_gates_report){
      document.getElementById('gates-report').innerHTML='<div class="empty">Sin quality_gates_report.json en el workspace</div>';
      return;
    }
    // Leer el reporte via el endpoint de releases o directamente desde el workspace status
    document.getElementById('gates-report').innerHTML=`<div class="card"><p class="meta">Workspace encontrado — el reporte se genera via quality_gate_runner.py desde el workspace.</p><p class="meta">Path: ${ws.path}</p></div>`;
  }catch(e){
    document.getElementById('gates-report').innerHTML=`<div class="empty">${e.message}</div>`;
  }
}

// ── Aprobaciones ──────────────────────────────────────────────────────────────

async function loadAllApprovals(){
  // No hay un endpoint /api/v1/approvals sin project_id; mostrar instrucción
  document.getElementById('approvals-list').innerHTML=
    '<div class="empty">Ingresa un Project ID arriba para aprobar o rechazar una acción</div>';
}

async function postApproval(type){
  const pid=document.getElementById('a-pid').value.trim();
  const action=document.getElementById('a-action').value.trim();
  const notes=document.getElementById('a-notes').value.trim();
  if(!pid||!action){toast('Project ID y Acción son requeridos','err');return;}
  try{
    const endpoint=type==='approve'?`/api/v1/approvals/${pid}`:`/api/v1/approvals/${pid}/reject`;
    const r=await api('POST',endpoint,{action,notes,approved_by:'Cesar'});
    toast(type==='approve'?'✓ Aprobado':'✗ Rechazado', type==='approve'?'ok':'err');
    document.getElementById('approvals-list').innerHTML=`<div class="card"><pre>${JSON.stringify(r,null,2)}</pre></div>`;
  }catch(e){toast(e.message,'err');}
}

// ── Auditoría ─────────────────────────────────────────────────────────────────

async function loadAudit(){
  try{
    const r=await api('GET','/api/v1/audit/verify');
    const color=r.verified?'#22c55e':'#ef4444';
    document.getElementById('audit-result').innerHTML=`
      <div class="card">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <span style="font-size:1.5rem">${r.verified?'✓':'✗'}</span>
          <div>
            <div style="font-weight:600;color:${color}">${r.verified?'Cadena verificada':'Errores detectados'}</div>
            <div class="meta">Part 11 compliant: ${r.part11_compliant}</div>
          </div>
        </div>
        <div class="meta">Entradas: ${r.log_count} | Verificadas: ${r.verified_count} | Hash errors: ${r.hash_errors} | Chain errors: ${r.chain_errors}</div>
        <div class="meta" style="margin-top:4px">Archivo: ${r.audit_file}</div>
      </div>`;
  }catch(e){toast(e.message,'err');}
}

// Init
checkHealth();
loadProjects();
</script>
</body>
</html>
