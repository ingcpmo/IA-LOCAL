project_id: gmpai_document_validation
client_type: pharma_mfg_site
objective: 'Analizar los 32 documentos de Rockwell y SCADA (URS, FS, DS, arquitectura,
  listados de alarmas, narrativas de control, protocolos SAT y documentacion de red/CSV),
  inventariarlos y verificarlos contra SHA256SUMS.txt, seleccionar las versiones vigentes
  ante posibles conflictos, crear agentes especializados, y determinar si la documentacion
  esta completa, trazable (URS-FS-DS-IQ-OQ-PQ) y alineada con FDA 21 CFR Part 11,
  EU GMP Annex 11 y principios ALCOA+, generando matrices de cumplimiento, evaluacion
  de riesgos y brechas con evidencia trazable a pagina/seccion de cada documento fuente.
  El sistema no declara cumplimiento GMP final ni aprueba documentos automaticamente:
  produce hallazgos para revision y decision humana (accept/reject/request_changes).'
regulatory_scope:
- 21_CFR_PART_11
- EU_GMP_ANNEX_11
- ALCOA_PLUS
