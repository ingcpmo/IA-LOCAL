project_id: oos_hplc_investigator
client_type: pharma_mfg_site
objective: 'Módulo de gestión e investigación de resultados OOS (Out-of-Specification)
  para análisis HPLC en laboratorio de control de calidad. El sistema debe guiar al
  analista a través del flujo FDA OOS 2006 en dos fases: Fase 1 (investigación de
  laboratorio: error del analista, cálculo, equipo, estándar, muestra) y Fase 2 (investigación
  completa con segunda muestra, segunda analista, comité de revisión). Debe generar
  el registro ALCOA+ con timestamp UTC, firma electrónica del analista y del supervisor,
  decisión de disposición del lote (aprobado/rechazado/retesteo), y audit trail inmutable
  compatible con 21 CFR Part 11. Cliente: laboratorio QC de manufactura de sólidos
  orales.'
