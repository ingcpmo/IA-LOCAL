project_id: lab_qc_project
client_type: lab_qc_dual_use
objective: >
  Solución GMP para laboratorio QC: gestión de LIMS (datos, acceso, audit trail),
  revisión de datos HPLC (SST, integración de picos, secuencia de inyección),
  investigación OOS (Fase I/II, FDA OOS Guidance 2022), Data Integrity (ALCOA+,
  21 CFR Part 11) y gestión de CAPA de laboratorio (5-Why, Fishbone, FTA).
regulatory_scope:
  - 21 CFR Part 211
  - 21 CFR Part 820
  - 21 CFR Part 11
  - ALCOA+
documents:
  FDA OOS Guidance 2022: pending
  FDA Data Integrity Guidance 2018: pending
  USP <621>: pending
  USP <1058>: pending
  ICH Q2(R1): pending
constraints:
  - no inventar texto regulatorio — toda fuente no disponible queda como PENDING_DOCUMENT
  - no tocar producto base (gmp-api puerto 8000)
  - docker independiente en puertos asignados por factory/registry/ports.yaml
  - trazabilidad completa via factory_audit.jsonl (21 CFR Part 11)
  - no guardar credenciales ni tokens en código ni en git
  - no usar --dangerously-skip-permissions
  - corpus completo con PDFs reales antes de go-live
mission_approval:
  autonomy_level: controlled_full
  allowed_actions:
    - analyze_requirement
    - design_agents
    - create_profiles
    - create_custom_agents
    - create_workspace
    - run_claude_code
    - generate_code
    - generate_tests
    - create_rag_structure
    - run_temp_docker
    - run_quality_gates
    - create_release
  deploy_docker_if_gates_pass: false
  stop_conditions:
    - product_base_change_detected
    - forbidden_path_detected
    - regulatory_source_missing_for_required_claim
    - quality_gate_fail
    - docker_runtime_fail
    - resource_limit_exceeded
    - claude_execution_failed
    - content_filter_blocked
  final_human_decision_required:
    - deploy_docker
    - keep_docker_running
    - expose_external_access
linked_release:
  project_id: lab_qc_project
  version: v0.1.0
  path: factory/releases/lab_qc_project/v0.1.0/
  release_commit: 7f362f2
  workspace_commit: 568dd74
  approval_status: pending_approval
status: approved
