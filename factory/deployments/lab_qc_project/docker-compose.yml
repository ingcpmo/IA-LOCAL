services:
  lab_qc_project_api:
    build: .
    container_name: lab_qc_project_api
    ports:
      - "8101:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - DATABASE_URL=postgresql://lab_qc_project_user:${POSTGRES_PASSWORD}@lab_qc_project_postgres:5432/lab_qc_project_db
      - REDIS_URL=redis://lab_qc_project_redis:6379/0
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - AUDIT_LOG_DIR=/app/data/audit_logs
      - GMP_API_KEY=${GMP_API_KEY}
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./knowledge:/app/knowledge
    mem_limit: 768m
    cpus: "1.0"
    restart: unless-stopped
    depends_on:
      lab_qc_project_postgres:
        condition: service_healthy
      lab_qc_project_redis:
        condition: service_healthy
    networks:
      - lab_qc_project_net

  lab_qc_project_postgres:
    image: postgres:16-alpine
    container_name: lab_qc_project_postgres
    # W8 F0: solo loopback. Los servicios se hablan por DNS de Docker
    # (lab_qc_project_postgres:5432); publicar en 0.0.0.0 exponía la base a
    # internet saltando UFW (Docker escribe DNAT antes que la cadena de UFW).
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=lab_qc_project_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=lab_qc_project_db
    volumes:
      - lab_qc_project_pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_qc_project_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_qc_project_net

  lab_qc_project_redis:
    image: redis:7-alpine
    container_name: lab_qc_project_redis
    # W8 F0: solo loopback (este Redis no tiene requirepass — ver §4 del doc).
    ports:
      - "127.0.0.1:6380:6379"
    mem_limit: 128m
    cpus: "0.25"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lab_qc_project_net

networks:
  lab_qc_project_net:
    driver: bridge

volumes:
  lab_qc_project_pgdata:
