# Instrucciones de re-ingesta post-deploy
# El script de ingesta llama al endpoint /api/v1/knowledge/ingest dentro del contenedor.
ingest_command: >
  Para cada source de cada step, ejecutar:
    docker exec <project_id>_api python3 /app/scripts/ingest_single.py \
      --file /app/data/regulations/<path> \
      --collection <collection>
  O usar: bash factory/scripts/ops/run_ingest_manifest.sh lab_qc_project
  (script pendiente de crear en redeploy R4)


