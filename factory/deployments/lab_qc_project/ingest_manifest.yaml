manifest: ingest_manifest
version: "1.0"
project_id: lab_qc_project
release: v0.2.0
description: >
  Artefacto de release R4: define el corpus que debe ingestarse en ChromaDB
  después de cada deploy limpio. Reproducible y auditado con knowledge_ingested.
  Fuente de verdad: este archivo. El estado real del ChromaDB debe coincidir
