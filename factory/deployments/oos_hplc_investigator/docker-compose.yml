services:
  oos_hplc_investigator_api:
    build: .
    container_name: oos_hplc_investigator_api
    ports:
      - "8102:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral:7b-instruct-q4_K_M
      - DATABASE_URL=postgresql://oos_hplc_user:${POSTGRES_PASSWORD}@oos_hplc_investigator_postgres:5432/oos_hplc_db
      - REDIS_URL=redis://oos_hplc_investigator_redis:6379/0
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - AUDIT_LOG_DIR=/app/data/audit_logs
      - GMP_API_KEY=${GMP_API_KEY}
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./knowledge:/app/knowledge
    mem_limit: 768m
    cpus: "1.0"
    restart: unless-stopped
    depends_on:
      oos_hplc_investigator_postgres:
        condition: service_healthy
      oos_hplc_investigator_redis:
        condition: service_healthy
    networks:
      - oos_hplc_net

  oos_hplc_investigator_postgres:
    image: postgres:16-alpine
    container_name: oos_hplc_investigator_postgres
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=oos_hplc_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=oos_hplc_db
    volumes:
      - oos_hplc_pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oos_hplc_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oos_hplc_net

  oos_hplc_investigator_redis:
    image: redis:7-alpine
    container_name: oos_hplc_investigator_redis
    ports:
      - "6381:6379"
    mem_limit: 128m
    cpus: "0.25"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oos_hplc_net

networks:
  oos_hplc_net:
    driver: bridge

volumes:
  oos_hplc_pgdata:
