# Catálogo de pruebas — oos_hplc_investigator
# GMP AI Factory — Capa 8 — Deployment F5
# Preparado en W3.5 para que el executor W4 distinga, por prueba,
# endpoints deterministicos (reglas Python) de endpoints que usan
# inferencia LLM local (Ollama).
project_id: oos_hplc_investigator
base_url: http://localhost:8102
tests:
  - test_id: health_check
    method: GET
    path: /health
    uses_llm: false

  - test_id: oos_records_create
    method: POST
    path: /api/v1/oos/records
    uses_llm: false

  - test_id: oos_records_list
    method: GET
    path: /api/v1/oos/records
    uses_llm: false

  - test_id: oos_records_findings
    method: POST
    path: /api/v1/oos/records/{record_id}/findings
    uses_llm: false

  - test_id: oos_records_advance
    method: POST
    path: /api/v1/oos/records/{record_id}/advance
    uses_llm: false

  - test_id: oos_records_close
    method: POST
    path: /api/v1/oos/records/{record_id}/close
    uses_llm: false

  - test_id: hplc_sst_validate
    method: POST
    path: /api/v1/hplc/sst/validate
    uses_llm: false

  - test_id: hplc_peaks_anomalies
    method: POST
    path: /api/v1/hplc/peaks/anomalies
    uses_llm: false

  - test_id: hplc_rsd
    method: POST
    path: /api/v1/hplc/rsd
    uses_llm: false

  - test_id: audit_alcoa_validate
    method: POST
    path: /api/v1/audit/alcoa/validate
    uses_llm: false

  - test_id: audit_stamp
    method: POST
    path: /api/v1/audit/stamp
    uses_llm: false

  - test_id: lot_disposition
    method: POST
    path: /api/v1/lot/disposition
    uses_llm: false

  - test_id: query_llm
    method: POST
    path: /api/v1/query
    uses_llm: true
    llm_model: mistral:7b-instruct-q4_K_M
