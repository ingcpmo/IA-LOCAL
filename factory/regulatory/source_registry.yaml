# W6 — Source Registry de fuentes regulatorias oficiales — MODO DISEÑO
#
# ESTADO: not_connected — NO EXISTE CONECTOR. Este registro define QUÉ fuentes
# oficiales consultaría el sistema y bajo qué límites, pero en W6 no hay ningún
# tráfico saliente: el registry es un archivo local que la UI muestra.
# Conectar cualquier fuente requiere aprobación humana explícita (fase futura).
# Diseño completo: factory/docs/W6_MISSION_CONTROL_ENTERPRISE.md §7.

version: 1
connectors_implemented: false   # verdad dura: cero HTTP externo en W6
default_policy:
  access: read_only
  user_agent_identified: true
  respect_robots_txt: true
  no_bulk_download: true
  no_recursive_crawling: true
  store_full_documents: false   # solo pointer + metadata + resumen + hash

sources:
  - source_id: fda_warning_letters
    name: FDA Warning Letters
    authority: FDA
    url: https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/compliance-actions-and-activities/warning-letters
    access_design: "listado HTML público paginado, filtro drugs/GMP"
    rate_limit_design: "1 req / 2 s · máx 20 páginas/día"
    status: not_connected
    last_checked: null

  - source_id: fda_483_public
    name: FDA Inspection Observations / Form 483 públicas
    authority: FDA
    url: https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-references/inspection-observations
    access_design: "listados públicos; muchos 483 no están online — limitación registrada, no simulada"
    rate_limit_design: "1 req / 2 s"
    status: not_connected
    last_checked: null

  - source_id: fda_data_dashboard
    name: FDA Data Dashboard
    authority: FDA
    url: https://datadashboard.fda.gov/
    access_design: "API pública JSON"
    rate_limit_design: "según ToS de la API · máx 1 req/s"
    status: not_connected
    last_checked: null

  - source_id: openfda_enforcement
    name: openFDA Drug Enforcement / Recalls
    authority: FDA
    url: https://api.fda.gov/drug/enforcement.json
    access_design: "API REST JSON oficial (key gratuita)"
    rate_limit_design: "límite oficial openFDA"
    status: not_connected
    last_checked: null

  - source_id: eudragmdp_nc
    name: EudraGMDP Non-Compliance Reports
    authority: EMA/EU
    url: https://eudragmdp.ema.europa.eu/
    access_design: "búsqueda pública del portal, consultas puntuales"
    rate_limit_design: "1 req / 2 s"
    status: not_connected
    last_checked: null

  - source_id: ema_gmp_public
    name: EMA public GMP information
    authority: EMA
    url: https://www.ema.europa.eu/en/human-regulatory-overview/research-and-development/compliance-research-and-development/good-manufacturing-practice
    access_design: "páginas públicas de guidance"
    rate_limit_design: "1 req / 2 s"
    status: not_connected
    last_checked: null

  - source_id: internal_docs
    name: Documentos internos cargados por el usuario
    authority: interna
    url: null
    access_design: "filesystem local (carpeta de carga controlada)"
    rate_limit_design: "n/a"
    status: not_connected
    last_checked: null
