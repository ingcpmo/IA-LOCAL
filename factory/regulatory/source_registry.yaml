# W6 — Source Registry de fuentes regulatorias oficiales
#
# W6.3 (2026-07-03, aprobado por Cesar): PRIMERA fuente conectada —
# openfda_enforcement (API REST JSON oficial). Conector read-only con rate
# limit duro (60s entre llamadas, 10/día UTC, máx 10 resultados por consulta),
# cada llamada exige nombre real y queda auditada. El resto de fuentes sigue
# not_connected: conectarlas requiere aprobación humana explícita.
# Diseño completo: factory/docs/W6_MISSION_CONTROL_ENTERPRISE.md §7.
#
# W9 Bloque 3 (2026-07-10, aprobado por Cesar): SEGUNDA y TERCERA fuente —
# openfda_device_enforcement y openfda_food_enforcement, mismo patrón que
# W6.3 (factory/services/regulatory_connector_extra_service.py), CUPO
# COMPARTIDO con openfda_enforcement (mismo connector_state.json, mismo
# rate limit 60s/10 por día — protege a openFDA de la fábrica en conjunto).
# Diseño: factory/docs/W9_BLOQUE3_SEGUNDA_FUENTE.md.

version: 3
connectors_implemented: true    # openfda_enforcement (W6.3) + device/food (W9 Bloque 3)
default_policy:
  access: read_only
  user_agent_identified: true
  respect_robots_txt: true
  no_bulk_download: true
  no_recursive_crawling: true
  store_full_documents: false   # solo pointer + metadata + resumen + hash

sources:
  - source_id: fda_warning_letters
    name: FDA Warning Letters
    authority: FDA
    url: https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/compliance-actions-and-activities/warning-letters
    access_design: "listado HTML público paginado, filtro drugs/GMP"
    rate_limit_design: "1 req / 2 s · máx 20 páginas/día"
    status: not_connected
    last_checked: null

  - source_id: fda_483_public
    name: FDA Inspection Observations / Form 483 públicas
    authority: FDA
    url: https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-references/inspection-observations
    access_design: "listados públicos; muchos 483 no están online — limitación registrada, no simulada"
    rate_limit_design: "1 req / 2 s"
    status: not_connected
    last_checked: null

  - source_id: fda_data_dashboard
    name: FDA Data Dashboard
    authority: FDA
    url: https://datadashboard.fda.gov/
    access_design: "API pública JSON"
    rate_limit_design: "según ToS de la API · máx 1 req/s"
    status: not_connected
    last_checked: null

  - source_id: openfda_enforcement
    name: openFDA Drug Enforcement / Recalls
    authority: FDA
    url: https://api.fda.gov/drug/enforcement.json
    access_design: "API REST JSON oficial (sin key; límite público 240 req/min)"
    rate_limit_design: "propio (más estricto): 1 llamada/60s · 10/día UTC · ≤10 resultados"
    status: connected            # W6.3 — único conector real; read-only auditado
    last_checked: null           # se superpone en runtime desde connector_state.json

  - source_id: openfda_device_enforcement
    name: openFDA Device Enforcement / Recalls
    authority: FDA
    url: https://api.fda.gov/device/enforcement.json
    access_design: "API REST JSON oficial (sin key; límite público 240 req/min)"
    rate_limit_design: "cupo COMPARTIDO con openfda_enforcement: 1 llamada/60s · 10/día UTC (drug+device+food) · ≤10 resultados"
    status: connected            # W9 Bloque 3 — read-only auditado
    last_checked: null           # se superpone en runtime desde connector_state.json

  - source_id: openfda_food_enforcement
    name: openFDA Food Enforcement / Recalls
    authority: FDA
    url: https://api.fda.gov/food/enforcement.json
    access_design: "API REST JSON oficial (sin key; límite público 240 req/min)"
    rate_limit_design: "cupo COMPARTIDO con openfda_enforcement: 1 llamada/60s · 10/día UTC (drug+device+food) · ≤10 resultados"
    status: connected            # W9 Bloque 3 — read-only auditado
    last_checked: null           # se superpone en runtime desde connector_state.json

  - source_id: eudragmdp_nc
    name: EudraGMDP Non-Compliance Reports
    authority: EMA/EU
    url: https://eudragmdp.ema.europa.eu/
    access_design: "búsqueda pública del portal, consultas puntuales"
    rate_limit_design: "1 req / 2 s"
    status: not_connected
    last_checked: null

  - source_id: ema_gmp_public
    name: EMA public GMP information
    authority: EMA
    url: https://www.ema.europa.eu/en/human-regulatory-overview/research-and-development/compliance-research-and-development/good-manufacturing-practice
    access_design: "páginas públicas de guidance"
    rate_limit_design: "1 req / 2 s"
    status: not_connected
    last_checked: null

  - source_id: internal_docs
    name: Documentos internos cargados por el usuario
    authority: interna
    url: null
    access_design: "filesystem local (carpeta de carga controlada)"
    rate_limit_design: "n/a"
    status: not_connected
    last_checked: null
