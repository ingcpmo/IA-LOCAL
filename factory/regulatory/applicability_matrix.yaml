# Matriz de aplicabilidad documental v2 (W5 Ciclo 1, Fase 3, Bloque 3.1)
#
# Valores por celda:
#   expected                  -> ausencia consolidada = DOCUMENTATION_GAP
#   optional                  -> ausencia = NOT_OBSERVED_OPTIONAL (no gap)
#   cross_reference_expected  -> evidencia primaria vive en otro documento,
#                                pero ESTE debe referenciarla; ausencia =
#                                CROSS_REFERENCE_MISSING
#   out_of_document_scope     -> no se ejecuta inferencia; resultado
#                                OUT_OF_DOCUMENT_SCOPE con puntero
#                                evidence_expected_in
#   review_required           -> no se ejecuta inferencia; cola de revision
#
# default OBLIGATORIO por requisito: review_required
# (P1: un tipo documental no contemplado JAMAS se omite en silencio)
#
# NO FABRICACION: los 19 requirement_id originales existen en
# factory/engines/gmpai_integrity/prompts/*.yaml (ver
# factory/docs/W5v2_FASE0_INVENTARIO.md §6). Regulaciones no ingeridas:
# comentario PENDING_DOCUMENT, sin filas inventadas.
#
# EXCEPCION DECLARADA (v2.1, 2026-07-29): "21_CFR_211.68(b)" SI esta en el
# catalogo y en esta matriz, pero TODAVIA NO tiene prompt ni agente en
# factory/engines/gmpai_integrity/prompts/. En una corrida real no se
# evaluaria: falta el agente fda_cgmp_211. La fila se declara aqui porque la
# aplicabilidad documental es una decision de gobernanza independiente de que
# el motor ya sepa ejecutarla -- pero no confundir "declarado" con "operativo".
#
# TODAS las filas de este archivo estan marcadas # PROPUESTO -- son una
# primera pasada de Claude Code razonada sobre el V-model GAMP 5 y el
# corpus real ya evaluado (FS_v1.2 SCADA-PCS, ver
# matriz_aplicabilidad_FS_v1_2_v5.json). La marca # PROPUESTO se conserva
# como registro de PROVENIENCIA (quien/como se originó cada valor), no
# como estado de aprobación -- Cesar confirmó la matriz completa en el
# Checkpoint B (decision_id MC-0001, ver
# factory/layer9/decisions/decisions.jsonl, approval.status abajo =
# human_confirmed). Cualquier fila que se agregue o edite DESPUÉS de esta
# aprobación debe marcarse # PROPUESTO de nuevo hasta la siguiente
# confirmación explícita.

matrix_version: "2.1"
# v2.1 (2026-07-29): se agregan las filas de 21_CFR_211.68(b) tras la
# ingesta de ecfr_21cfr_part211. MC-0001 NO las cubre -- estan marcadas
# PROPUESTO y requieren una confirmacion humana nueva.
approval:            # Checkpoint B confirmado — ver factory/layer9/decisions/decisions.jsonl (MC-0001)
  status: "human_confirmed"
  decision_id: "MC-0001"
  approved_by: "Cesar"
  approver_role: "project_lead"
  approved_at_utc: "2026-07-17T16:26:33Z"

document_types: [URS, FS, DS, CS, RA, IQ, OQ, PQ, SOP]

