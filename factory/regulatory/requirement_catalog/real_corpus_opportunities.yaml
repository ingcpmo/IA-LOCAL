# --- parámetro EXPLÍCITO del protocolo de coincidencia de página ---
page_match_policy:
  tolerance_pages: 0        # 0 = página dentro de [page_band]; súbelo solo con justificación documentada

methodology: >
  QA lee cada documento del corpus y registra toda desviación que DEBERÍA detectarse
  (trazabilidad, cobertura de prueba, completitud técnica, integridad de datos, etc.),
  INDEPENDIENTEMENTE de si el analizador la emitió. score_recall PROPONE candidatos
  estructurales por (expected_class, expected_subtype, document) y página del finding
  dentro de [page_band ± page_match_policy.tolerance_pages], pero el TP se decide por la
  CONFIRMACIÓN HUMANA de la correspondencia (matched_finding_id + match_confirmed_by +
  match_note). Sin confirmación -> FN. Matching UNO-A-UNO: un finding confirmado no
  acredita dos oportunidades.

