    governed_interpretation: 'Exige ambos medios ("by both") -- fisico y electronico -- contra dano, y
      una verificacion DOCUMENTADA de accesibilidad/legibilidad/exactitud de los datos almacenados. El
      texto no impone una periodicidad literal universal ("should be checked" no equivale a "debe reverificarse
      cada N meses"): la verificacion debe estar documentada, y cuando el riesgo del sistema y el procedimiento
      interno lo justifiquen, debe existir ademas una frecuencia de reverificacion definida -- ausencia
      total de verificacion documentada es incumplimiento; ausencia de frecuencia definida en un sistema
      donde el riesgo la justifica es un gap; una verificacion unica bien fundamentada, en un sistema
      de bajo riesgo, no se rechaza automaticamente solo por no repetirse. El acceso a los datos debe
      estar garantizado durante todo el periodo de retencion declarado. La prueba de restauracion de backup
      es evidencia COMPLEMENTARIA cuando existe mecanismo de backup -- pertenece propiamente al requisito
