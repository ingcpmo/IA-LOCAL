    governed_interpretation: 'El registro debe realizarse contemporaneamente con la actividad -- esto
      no se relaja en el caso del escribiente. La guia reconoce una excepcion legitima y acotada (Section
      5.2: cuando el ejecutor mismo registrar en el momento compromete el producto/actividad): un escribiente
      (segunda persona) registra la actividad EN EL MOMENTO en que ocurre e identifica al ejecutor real
      -- el registro del escribiente sigue siendo contemporaneo, no retrospectivo. Lo unico que puede
      ser posterior es la contrafirma/confirmacion del propio ejecutor sobre lo que el escribiente registro,
      y solo si esa contrafirma tardia esta justificada (motivo real) y gobernada (procedimiento que la
      define, plazo maximo, revision). Una transcripcion tardia del dato mismo (no una contrafirma) nunca
      se acepta solo porque la demora quedo documentada -- documentar la demora es condicion necesaria
      pero no suficiente; ademas debe estar dentro de los casos y procedimiento que la guia gobierna (escribiente
      justificado, o contrafirma tardia justificada y gobernada). Fuera de esos dos casos, cualquier demora
      es un incumplimiento, este o no documentada.'
    evidence_min_criteria:
    - Registro en el momento de la actividad como regla general.
    - 'Caso escribiente: el escribiente registra en el momento de la actividad (no retrospectivamente)
      e identifica al ejecutor real.'
    - 'Caso contrafirma: procedimiento gobernado que define cuando una contrafirma tardia del ejecutor
      es aceptable, con motivo real, plazo maximo y revision.'
    exclusion_criteria:
    - Transcripcion tardia del dato mismo (no una contrafirma) aceptada unicamente porque la demora quedo
      documentada, fuera del caso de escribiente/contrafirma gobernada.
    - Escribiente que registra retrospectivamente (no en el momento de la actividad) o que no identifica
      al ejecutor real.
    - Contrafirma tardia sin procedimiento gobernado que la autorice (sin motivo real, sin plazo maximo,
      sin revision).
    - Demora sistematica sin justificacion real.
    typical_insufficient_evidence:
    - Se menciona timestamp sin confirmar que corresponde al momento real de la actividad.
    - Se documenta la demora de una transcripcion tardia como si eso por si solo la hiciera aceptable,
      sin encuadrarla en el caso de escribiente o contrafirma gobernada.
    weak_keywords:
