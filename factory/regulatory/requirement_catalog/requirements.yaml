    governed_interpretation: 'Tres controles independientes bajo el mismo paragraph (b), los tres exigidos
      -- ninguno sustituye a otro. (1) CONTROL DE CAMBIOS: solo personal autorizado puede instituir cambios
      en registros maestros de produccion y control (u otros registros); exige un mecanismo TECNICO que
      restrinja quien puede cambiar, no solo una politica declarada. (2) EXACTITUD DE I/O: los datos de
      entrada y salida del sistema (formulas, registros, datos) deben verificarse por exactitud; el grado
      y frecuencia de esa verificacion se basa en la complejidad y confiabilidad del sistema -- es decir,
      un enfoque proporcional al riesgo, no una frecuencia fija universal. (3) RESPALDO: los datos ingresados
      deben respaldarse de forma exacta, completa y protegida contra alteracion, borrado accidental o
      perdida; la unica excepcion es un dato eliminado deliberadamente por el propio proceso automatizado
      (ej. un calculo intermedio), y en ese caso especifico se exige en su lugar un registro escrito del
      programa con datos de validacion que lo sustenten -- la excepcion no es "no hace falta respaldar",
      es "el respaldo se sustituye por otra evidencia equivalente, documentada".'
    evidence_min_criteria:
    - 'Control de cambios: mecanismo tecnico (no solo politica) que restringe quien puede modificar registros
      maestros de produccion y control.'
    - 'Control de cambios: identificacion de que la modificacion la realizo personal con autorizacion
      vigente para ese registro.'
    - 'Exactitud I/O: mecanismo descrito de verificacion de exactitud de datos de entrada/salida del sistema.'
    - 'Exactitud I/O: el grado o frecuencia de esa verificacion esta justificado por la complejidad/confiabilidad
      del sistema (no declarado sin criterio).'
    - 'Respaldo: mecanismo de respaldo de los datos ingresados, con evidencia de que es exacto y completo.'
    - 'Respaldo: proteccion descrita contra alteracion, borrado accidental o perdida del respaldo.'
    - 'Respaldo (caso excepcional): si algun dato se elimina por diseno del proceso automatizado, registro
      escrito del programa + datos de validacion que lo sustenten, en lugar del respaldo.'
    exclusion_criteria:
    - Control de cambios declarado solo como politica/procedimiento sin mecanismo tecnico que lo haga
      cumplir (ej. "solo el ingeniero de control puede modificar el programa" sin control de acceso real
      en el sistema).
    - Exactitud I/O mencionada de forma generica ("el sistema valida los datos") sin describir que se
      verifica ni la base de la frecuencia/rigor.
    - Respaldo mencionado como intencion futura ("se realizaran respaldos") sin mecanismo, ubicacion ni
      proteccion descritos.
    - Eliminacion de datos por el sistema sin el registro escrito del programa ni datos de validacion
      que la sustenten -- la excepcion de respaldo no se activa por default.
    typical_insufficient_evidence:
    - '"Los cambios requieren aprobacion" sin describir el mecanismo tecnico que impide un cambio no autorizado.'
    - '"El sistema verifica los datos" sin especificar que se verifica ni el criterio de frecuencia/rigor.'
    - '"Los datos se respaldan periodicamente" sin mecanismo, integridad ni proteccion descritos.'
