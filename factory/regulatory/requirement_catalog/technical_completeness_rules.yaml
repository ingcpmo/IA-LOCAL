excluded_cases:
  - CASE_ID: C02
    reason: "Sin fuente normativa ni requisito de cliente que exija documentar fuente/sincronizacion de tiempo. URS-PCS-SR-038 (UR5.4.4) es manejo de DST, no sincronizacion."
    client_requirement_found: false
    client_requirement_id: null
  - CASE_ID: C11
    reason: "Annex 11 12.1 admite controles solo-logicos justificados. FS F09.00 traza al puntero generico UR3.4.1 (=implementar Part 11), sin Req-ID de cliente discreto para seguridad fisica."
    client_requirement_found: false
    client_requirement_id: null
  - CASE_ID: C13
    reason: >
      Revisada la evidencia literal: UR4.3.4 exige "a UPS battery back-up system
      installed"; UR4.3.5 exige que el UPS "supply the connected system power for
      at least fifteen (15) minutes ... after loss of facility electrical power".
      Ambos son requisitos de CONTINUIDAD DE ENERGIA (ride-through de UPS), NO de
      reinicio ni de persistencia de estado. La descripcion de auto-recuperacion
      tras fallo de energia esta en FS F19.00 (traza a UR3.2.2), como elaboracion
      de diseno, NO como texto de requisito. El defecto C13 tal como esta
      planteado (persistencia de estado tras reinicio del PLC) NO tiene requisito
      explicito que lo sostenga. Incorporarlo con una regla de "continuidad de
      energia" cambiaria el objetivo del caso -> prohibido. C13 FUERA del
      detector automatico.
    client_requirement_found_for_case_as_framed: false
    client_requirement_id: null
    related_client_requirements_different_objective: ["UR4.3.4", "UR4.3.5 (UPS ride-through)", "UR3.2.2 (failure/recovery, FS F19.00)"]
    C13_EXPLICITLY_REQUIRES_RESTART_OR_STATE_PERSISTENCE: "NO"
    C13_DETERMINISTIC_RULE_SAFE: "NO"
  - CASE_ID: C07
    reason: "Requiere juicio de criticidad + defecto de tipo tema-ausente. Permanece separado; no se activa HYBRID ni LLM."
    client_requirement_found: null
    client_requirement_id: null
