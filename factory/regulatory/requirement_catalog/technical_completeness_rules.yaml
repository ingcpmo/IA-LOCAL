# =============================================================================
# TECHNICAL COMPLETENESS RULES -- B6b v2 (DETERMINISTIC)          [FIRMADO 1.1 -- OD-6 context-scoped]
# =============================================================================
# Contenido GOBERNADO: codifica interpretacion regulatoria (que sub-atributos
# son obligatorios para un control tecnico, segun una fuente normativa
# explicita). Mismo estatus que `decomposition.yaml`.
#
# FIRMADO por Capa 9 (Cesar) el 2026-08-27 como version gobernada 1.1.
# v1.1 (OD-6) acota el ALCANCE de la evaluacion del comportamiento
# (document_wide -> context_scoped); NO toca REQUIRED_BEHAVIOR,
# SOURCE_REQUIREMENT_ID, family_signals ni cross_reference_suppressors.
# Consumido por
# `factory/regulatory/findings/technical_findings.py` (B6b v2).
#
# 7 reglas (sin cambios de contenido vs v1.0):
#   C01, C03 (solo restore verification -- excluir RTO/RPO), C04, C05, C08,
#   C09 (comportamiento tecnologicamente neutro -- NO exigir criptografia), C10.
#
# REGLA DURA (Capa 9): el REQUIRED_BEHAVIOR se toma SOLO de la fuente normativa
# o de un requisito de cliente explicito. Ninguna implementacion concreta
# (NTP, RTO/RPO, SHA-256, HMAC, firma digital, "authorization matrix" como
# artefacto formal, controles fisicos especificos, memoria retentiva) es
# requisito: son EXCLUDED_IMPLEMENTATION_ASSUMPTIONS. La regla detecta la
# AUSENCIA del comportamiento requerido; nunca exige una tecnologia concreta.
#
# Cada regla emite, cuando dispara, un Finding con:
#   - machine_state = MACHINE_DEVIATION_CANDIDATE  o  MACHINE_INCONCLUSIVE
#   - human_state   = UNREVIEWED  (inmutable desde codigo de IA)
#   - destino: cola de revision humana con cobertura declarada.
# NUNCA auto-confirma, NUNCA auto-descarta, NUNCA declara cumplimiento.
#
# NO cubierto por este artefacto (sin base para regla determinista):
#   C02 TIME_SYNC          -- ninguna clausula citada exige documentar fuente/
#                             sincronizacion de tiempo; URS-PCS-SR-038 es DST,
#                             no sincronizacion. FUERA del detector automatico.
#   C11 PHYSICAL_SECURITY   -- Annex 11 12.1 admite solo-logico justificado; sin
#                             Req-ID de cliente discreto. FUERA del detector.
#   C13 STATE_PERSISTENCE   -- SI hay base de cliente (UR4.3.4/UR4.3.5, MCCPDC
#                             3.2.2) pero Capa 9 no lo autorizo en este lote.
#   C07 REDUNDANCY          -- permanece separado; requiere decision HYBRID/LLM.
# =============================================================================

