independent_author_declared_at: "2026-08-31"

# --- freeze del ground truth PRE-RUN ---
ground_truth_frozen: true
ground_truth_frozen_at: "2026-08-31"
# Algoritmo determinista de la huella (reproducible desde disco):
#   frozen = {
#     "cases": [ { "case_id", "expected_finding", "expected_class", "expected_subtype",
#                  "provenance", "source_clause_or_rationale", "human_reviewed", "human_approved" } ... ],
#     "thresholds": {...}, "match_policy": {...} }
#   canon = json.dumps(frozen, sort_keys=True, ensure_ascii=True, separators=(",", ":"))
#   pre_run_ground_truth_sha256 = sha256(canon.encode("utf-8")).hexdigest()
#   EXCLUYE: page_band (real o provisional), findings / resultados del analizador,
#            timestamps mutables, cualquier estado post-run.
pre_run_ground_truth_sha256: "125accf9d08cca76dde5f5fdc441f154fafa0a4099e2c4fdd93016013ce05b6e"

# page_band canónico: RESUELTO desde el store canónico REAL de la corrida diagnóstica
# (held_out_d5d_20260831/canonical), verificado por lectura de los .sqlite3 -- NO desde comentarios.
# Etiqueta _DIAGNOSTIC porque la confirmación humana de materialización llegó DESPUÉS de la corrida
# -> no es una resolución de gate formal.
page_bands_canonical: RESOLVED_DIAGNOSTIC
canonical_materialization_verifiable: true
held_out_canonical: "factory/regulatory/pilot_run/held_out_d5d_20260831/"   # dir usado por analyzer_run

thresholds:                                    # fijados ex-ante; CONGELADOS -- no cambian con el resultado
  TECHNICAL_RECALL_MIN: 0.90
  TECHNICAL_FALSE_POSITIVE_MAX: 0.05
  FABRICATED_CITATIONS_MAX: 0

match_policy:
  by: [finding_class, subtype, document, page_band]   # estructural; el ground truth NO aporta texto
  page_band_tolerance: 3

# --- GROUND TRUTH PRE-RUN (congelado). `match` = UNA definición operativa por caso, con el
#     page_band REAL verificado desde el store canónico. `provisional_match` = SOLO trazabilidad
#     histórica del esqueleto; el scorer NUNCA lo lee. `match_operational_resolved: false`
#     porque la secuencia de gate formal no fue válida (confirmación post-run). ---
cases:
  - case_id: HO-T-001
    provenance_tag: REG
    source_clause: "21 CFR 11.10(e) — audit trail: fecha/hora, quién, valor anterior/nuevo"
    expected: {finding: true, finding_class: DataIntegrityFinding, subtype: AUDIT_TRAIL_INTEGRITY_GAP}
    match: {document: HO-FS, page_band: [12, 12]}   # REAL, verificado desde canonical/HO-FS.sqlite3
    provisional_match: {document: HO-FS, page_band: [10, 16]}   # trazabilidad histórica; scorer NO lo lee
    match_operational_resolved: false
    human_reviewed: true
    human_decision: CONFIRM

  - case_id: HO-T-002
    provenance_tag: REG
    source_clause: "EU GMP Annex 11 §7.2 — backups regulares y verificación de restauración"
    expected: {finding: true, finding_class: TechnicalFinding, subtype: BACKUP_RECOVERY_GAP}
    match: {document: HO-FS, page_band: [14, 14]}   # REAL, verificado desde canonical/HO-FS.sqlite3
    provisional_match: {document: HO-FS, page_band: [10, 16]}
    match_operational_resolved: false
    human_reviewed: true
    human_decision: CONFIRM

  - case_id: HO-T-003
    provenance_tag: DOM
    source_clause: null
    reviewer_rationale: "El FS nombra 'roles' pero no describe verificación de autoridad por operación."
    expected: {finding: true, finding_class: SecurityFinding, subtype: AUTHORITY_CHECK_GAP}
    match: {document: HO-FS, page_band: [15, 15]}   # REAL, verificado desde canonical/HO-FS.sqlite3
    provisional_match: {document: HO-FS, page_band: [10, 16]}
    match_operational_resolved: false
    human_reviewed: true
    human_decision: CONFIRM

  - case_id: HO-T-004
    provenance_tag: ADV
    human_reviewed: true
    human_approved: true
    human_decision: CONFIRM
    source_clause: null
    machine_proposal_note: "Detector de completitud propuso ACCESS_CONTROL_GAP; revisor humano lo aprobó."
    expected: {finding: true, finding_class: SecurityFinding, subtype: ACCESS_CONTROL_GAP}
    match: {document: HO-FS, page_band: [15, 15]}   # REAL, verificado desde canonical/HO-FS.sqlite3
    provisional_match: {document: HO-FS, page_band: [10, 16]}
    match_operational_resolved: false

  # --- negativo: control descrito por completo -> el analizador NO debe emitir nada ---
  - case_id: HO-T-N01
    provenance_tag: DOM
    source_clause: null
    reviewer_rationale: "FS conforme separado: audit trail completo + protección anti-modificación."
    expected: {finding: false, finding_class: null, subtype: null}
    match: {document: HO-FSOK, page_band: [3, 3]}   # REAL, verificado desde canonical/HO-FSOK.sqlite3
    provisional_match: {document: HO-FSOK, page_band: [1, 10]}
    match_operational_resolved: false
    human_reviewed: true
    human_decision: CONFIRM

