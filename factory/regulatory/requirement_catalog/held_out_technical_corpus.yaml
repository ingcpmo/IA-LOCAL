# --- REMEDIATION ---
analyzer_remediation:
  status: IMPLEMENTED_PENDING_APPROVAL      # OPEN -> RCA -> v1.2 implementada; gate humano APPROVE_REMEDIATION_V1_2
  opened_at: "2026-08-31"
  implemented_at: "2026-08-31"
  d5_d_status: REMEDIATION_REQUIRED
  rules_version: "1.2"                      # technical_completeness_rules.yaml (pending_approval.approved=false)
  approval_gate: APPROVE_REMEDIATION_V1_2
  approval_package: "docs_plan/D5_D_REMEDIATION_V1_2_APPROVAL_PACKAGE_20260831.md"
  design_ref: "docs_plan/D5_D_ANALYZER_REMEDIATION_DESIGN_20260831.md"
  root_cause_analysis: READ_ONLY_DONE
  diagnostic_remediation_check:             # NO es gate -- held-out contaminado
    run_with: "technical_completeness_rules v1.2"
    document_egress_bytes: 0
    per_case: {HO-T-001: TP, HO-T-002: TP, HO-T-003: TP, HO-T-004: TP, HO-T-N01: TN}
    diagnostic_recall: 1.0                  # 0.50 -> 1.0
    diagnostic_false_positive_rate: 0.0     # 1.0 -> 0.0
    diagnostic_fabricated_citations: 0
    note: "Diagnostico. El cierre formal de D5-D exige D5-D2 (held-out fresco, casos nuevos)."
  targets:
    - case_id: HO-T-002
      outcome: FN
      subtype: BACKUP_RECOVERY_GAP
      rule: C03
      root_cause_category: RULE_TRIGGER__TOPIC_ANCHOR_LEXICAL_COVERAGE
      detail: >-
        Claim HO-FS p.14 "System data is copied to a network share periodically." NO contiene
        ningún término de C03.topic_anchor ["backup","back-up","back up","respaldo","copia de
        seguridad"] -> no se ancla la regla -> la lógica absence-dependent (family:restore_verified)
        NUNCA se evalúa -> FN. Extracción/canonicalización correctas (claim literal). La brecha
        está en la cobertura léxica del topic_anchor: no reconoce la paráfrasis
        "copied ... periodically / to a network share" como el tópico de backup.
    - case_id: HO-T-003
      outcome: FN
      subtype: AUTHORITY_CHECK_GAP
      rule: C05
      root_cause_category: SUBTYPE_DISCRIMINATION__TOPIC_ANCHOR_SCOPE
      detail: >-
        Claim HO-FS p.15 "Three named roles are available in the configuration screen." ancla C04
        (topic_anchor incluye el token "role"/"roles" -> emitió ACCESS_CONTROL_GAP = HO-T-004 TP)
        pero NO ancla C05 (topic_anchor exige la frase "role based access"; "named roles are
        available" no coincide) -> sin ancla C05 en HO-FS -> FN. C05 sí disparó en HO-URS p.2
        ("role based access") pero fuera del scope del caso. La misma evidencia ("existen roles")
        ancla C04 y no C05: el set de topic_anchor de C05 es más estrecho que el de C04 para
        evidencia equivalente.
    - case_id: HO-T-N01
      outcome: FP
      subtype: ACCESS_CONTROL_GAP
      rule: C04
      root_cause_category: TOPIC_ANCHOR_OVER_BROAD__MISSING_CROSS_TOPIC_SUPPRESSION
      detail: >-
        Claim HO-FSOK p.3 (inmutabilidad del audit trail) contiene el token "role" en
        "...cannot be modified or disabled by any role including administrators" -> C04.topic_anchor
        ["role","roles",...] ancla de forma incidental. scope = ese único claim; no hay señales de
        family:per_operation_authorization -> C04 concluye "tópico presente, comportamiento ausente"
        y emite ACCESS_CONTROL_GAP -> FP. El tópico real del claim es protección del audit trail
        (C01/C09), no estructura de control de acceso. Falta un supresor cruzado / de evidencia
        negativa que reconozca que el match de "role" es incidental en una frase sobre otro control.
  do_not_touch:
    - "ground truth / held-out expected"
    - "thresholds"
    - "technical_completeness_rules.yaml (todavía -- solo RCA read-only)"
  current_held_out_reuse_for_final_gate: PROHIBITED
  reuse_note: >-
    Una vez usados HO-T-002 / HO-T-003 / HO-T-N01 para diseñar/modificar el analizador, estos 5
    casos quedan contaminados. El cierre formal de D5 requerirá un D5-D2 FRESH INDEPENDENT HELD-OUT
    con casos nuevos no observados durante la remediation, definidos por la autora independiente.

