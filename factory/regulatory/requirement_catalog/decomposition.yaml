# Descomposición de requisitos en sub-criterios atómicos verificables (V2, B3).
#
# Contenido GOBERNADO. Firmado por Capa 9 (Cesar) el 2026-08-27 sobre
# docs_plan/PROPUESTA_DECOMPOSITION_REQUIREMENTS_V2.md ("firmo con los
# cambios, siempre que estos ayuden a mejorar").
#
# Archivo HERMANO de requirements.yaml -- NO se mete dentro del catálogo v1
# porque requirement_catalog_entry_v1.json es additionalProperties:false y
# tocarlo rompería CURRENT. Se carga por separado en el camino V2
# (requirement_decomposition_loader.py). El catálogo v1 y su schema quedan
# intactos.
#
# Cada sub-criterio es una re-expresión atómica de citation_text +
# evidence_min_criteria del requisito (ver `derived_from`). NO añade ni
# elimina exigencias -- desdobla las compuestas. La cita citable de
# cualquier `observed` sigue siendo el Claim.source_text literal; el
# sub-criterio solo enmarca la pregunta al modelo y la recuperación.
#
# Reglas duras: cero LLM en runtime (estático); el verificador
# (evidence_verifier) no se toca; el negativo obligatorio ANNEX11_4 sigue
# rechazándose (ver la nota de guardián en su bloque); ningún cambio a
# este archivo sin nueva versión + firma de Capa 9.

