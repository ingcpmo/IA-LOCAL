base_agent: integrity
profiles:
  integrity_lims_profile:
    profile_id: integrity_lims_profile
    base_agent: integrity
    coverage_estimate: "75%"
    justification: >
      El agente integrity cubre ALCOA+, audit trail y sistemas híbridos al 75%.
      El delta especializa en: LIMS como sistema computarizado 21 CFR Part 11 /
      211.68, cadena de custodia de muestras, acceso por roles, audit trail de
      entradas manuales vs automáticas, AIQ (USP <1058>). Marco dual pharma+device.
    rag_collection: lab_qc_lims_di
    corpus_pending:
      - "FDA Data Integrity Guidance 2018 (completo) — PDF"
      - "MHRA Data Integrity Guidance 2021 — PDF (opcional)"
    corpus_available:
      - "21 CFR Part 11 §11.10 (todos los controles) — texto CFR público"
      - "21 CFR 211.68 (computarized systems en drug manufacturing) — texto CFR público"
      - "ALCOA+ 9 atributos — concepto documentado en guías FDA"
    test_questions:
      - question: "El administrador del LIMS puede deshabilitar el audit trail sin aprobación de QA. ¿Qué riesgo representa?"
        expected_keywords: ["alcoa", "attributable", "critical", "21 cfr 11.10", "part 11", "capa"]
        acceptance: "Debe mapear a ALCOA+ Attributable/Contemporaneous, citar 21 CFR 11.10(e), clasificar CRITICAL"
      - question: "Los usuarios del LIMS comparten una cuenta genérica 'lab_user'. ¿Qué controles faltan?"
        expected_keywords: ["individual", "unique", "11.10(d)", "attributable", "access control", "shared"]
        acceptance: "Debe citar 21 CFR 11.10(d) acceso individual, ALCOA+ Attributable, remediation: cuentas individuales"
      - question: "Los resultados de HPLC se ingresan manualmente al LIMS; los archivos .raw no están vinculados. ¿Es conforme?"
        expected_keywords: ["original", "raw data", "datos originales", "link", "traceable", "11.10", "211.194"]
        acceptance: "Debe identificar gap ALCOA+ Original, citar preservación de datos crudos, recomendar vinculación instrumental"

  integrity_part11_ot_profile:
    profile_id: integrity_part11_ot_profile
    base_agent: integrity
    coverage_estimate: "70-75%"
    justification: >
      El agente integrity cubre ALCOA+, audit trail y 21 CFR Part 11 al 70-75%
      para sistemas de datos de laboratorio/manufactura. El delta especializa
      el contexto a sistemas OT (PLC/SCADA/HMI, Rockwell) donde los "registros
      electrónicos" son logs de controlador, configuraciones de proyecto PLC y
      credenciales de acceso a paneles/HMI en vez de LIMS. Mision de origen:
      gmpai_document_validation (validacion documental Rockwell/SCADA).
    rag_collection: ot_part11_reference
    corpus_available:
      - "21 CFR Part 11 texto oficial completo (XML eCFR, source_id ecfr_21cfr_part11, sha256 7fff122d..., ingerido 2026-08-03) — texto normativo real, no solo numeracion"
    corpus_pending:
      - "FDA guidance interpretativa sobre Part 11 (Scope and Application, 2003) — no disponible en la fabrica"
    test_questions:
      - question: "Un panel PLC permite login con una cuenta generica 'operator' compartida por todo el turno. ¿Que clausula de Part 11 aplica y que riesgo representa?"
        expected_keywords: ["11.10(d)", "access", "individual", "authorized", "shared account"]
        acceptance: "Debe citar 21 CFR 11.10(d), identificar riesgo de atribucion (ALCOA+ Attributable) y recomendar cuentas individuales"
      - question: "El HMI de MCCPDC no registra quien reconocio (acknowledge) una alarma critica. ¿Que brecha existe?"
        expected_keywords: ["audit trail", "11.10(e)", "timestamp", "trazabilidad"]
        acceptance: "Debe citar 21 CFR 11.10(e) (audit trail) y clasificar severidad segun impacto en trazabilidad de alarmas GMP"
      - question: "La documentacion SAT no menciona validacion del software del PLC antes de puesta en marcha. ¿Es evidencia suficiente de cumplimiento 11.10(a)?"
        expected_keywords: ["evidencia insuficiente", "validation", "11.10(a)"]
        acceptance: "Debe responder 'evidencia insuficiente', nunca asumir cumplimiento sin evidencia documental explicita"

  integrity_cgmp211_ot_profile:
    profile_id: integrity_cgmp211_ot_profile
    base_agent: integrity
    coverage_estimate: "70%"
    justification: >
      21 CFR Part 211 §211.68(b) es la REGLA PREDICADO de los controles sobre
      sistemas computarizados en manufactura farmaceutica: cambios instituidos
      solo por personal autorizado, verificacion de exactitud de entrada/salida
      y respaldo de datos. Comparte con el agente base integrity el dominio de
      control de acceso, exactitud del dato y respaldo (~70%). El delta es de
      ENCUADRE, no de tema: separa la exigencia predicado (que control exige la
      cGMP) de Part 11 (como se gestiona el registro electronico que esa
      exigencia produce) — confundirlas es el error que el propio prompt
      prohibe en su regla 5. Contexto OT (PLC/SCADA/HMI): el "computer or
      related system" es el controlador y el SCADA, y los "master production
      and control records" son recetas, setpoints y configuracion de proyecto.
      Mision de origen: gmpai_document_validation.
    rag_collection: ot_cgmp211_reference
    corpus_available:
      - "21 CFR Part 211 texto oficial completo (XML eCFR, source_id ecfr_21cfr_part211, sha256 ecd9f8ba..., ingerido 2026-07-29) — texto normativo real, no solo numeracion"
    corpus_pending:
      - "FDA Guidance on Computerized Systems Used in Clinical/GMP settings — no disponible en la fabrica"
    test_questions:
      - question: "Las recetas del SCADA-PCS pueden editarse desde una cuenta de mantenimiento sin aprobacion registrada. ¿Que exige 211.68(b)?"
        expected_keywords: ["211.68", "authorized personnel", "master production", "control records", "cambios"]
        acceptance: "Debe citar 211.68(b) (cambios en master production and control records solo por personal autorizado) y NO resolverlo citando 11.10(d)"
      - question: "El FS no describe ninguna verificacion de exactitud de los valores que el PLC envia al historiador. ¿Es evidencia suficiente de cumplimiento de 211.68(b)?"
        expected_keywords: ["evidencia insuficiente", "input", "output", "accuracy", "verification"]
        acceptance: "Debe responder 'evidencia insuficiente', nunca afirmar incumplimiento del sistema por ausencia en un documento de ingenieria (regla 4 del prompt)"
      - question: "El documento describe audit trail conforme a Part 11 pero no menciona respaldo de los datos ingresados al sistema. ¿Cubre eso 211.68(b)?"
        expected_keywords: ["backup", "respaldo", "no", "211.68", "predicado"]
        acceptance: "Debe rechazar el control de Part 11 como evidencia del requisito predicado de backup file — es el caso exacto que la regla 5 del common_contract prohibe"

  integrity_annex11_ot_profile:
    profile_id: integrity_annex11_ot_profile
    base_agent: integrity
    coverage_estimate: "70%"
    justification: >
      Annex 11 comparte con Part 11/ALCOA+ el dominio de integridad de
      registros electronicos y control de sistemas computarizados (~70% de
      cobertura comun con el agente base integrity). El delta cubre los
      clausulados propios de EU GMP Annex 11 (gestion de riesgo de CSV,
      personal, proveedores/terceros, ciclo de vida, respaldo) para
      documentacion OT Rockwell/SCADA. Mision de origen: gmpai_document_validation.
    rag_collection: ot_annex11_reference
    corpus_pending:
      - "EU GMP Annex 11 texto completo (PDF oficial EMA) — no disponible en la fabrica, solo se citan numeros de clausula publicos (§4, §7.1, §9, §12, §17)"
    corpus_available:
      - "Identificadores de clausula Annex 11 §4 (risk management), §7.1 (data storage), §9 (audit trail), §12 (security), §17 (archiving) — numeracion publica"
    test_questions:
      - question: "No existe evaluacion de riesgo documentada para el sistema SCADA-PCS antes de su puesta en marcha. ¿Que clausula de Annex 11 aplica?"
        expected_keywords: ["annex 11", "§4", "risk management", "risk assessment"]
        acceptance: "Debe citar Annex 11 §4 (gestion de riesgo) y marcar evidencia insuficiente si no hay documento de risk assessment"
      - question: "Los respaldos del proyecto PLC se guardan en un USB sin control de acceso. ¿Que riesgo de Annex 11 representa?"
        expected_keywords: ["§7.1", "backup", "data storage", "security"]
        acceptance: "Debe citar Annex 11 §7.1 y §12 (seguridad), clasificar severidad mayor/critica segun exposicion"
