project:
  id: r6_change_control
  name: GMP Change Control Module
  version: "0.1.0"
  client_type: pharma_mfg_site
  domains:
    - LIMS
    - DATA_INTEGRITY
    - CAPA

deployment:
  api_port: 8102
  postgres_port: 5434
  redis_port: 6381
  base_image: python:3.11-slim
  service_name: r6_cc

regulatory_scope:
  - 21_CFR_PART_11
  - 21_CFR_PART_211
  - ALCOA+

pending_documents:
  - name: ICH Q10 Pharmaceutical Quality System
    status: PENDING_DOCUMENT
    required_before_golive: true
  - name: FDA Process Validation Guidance 2011
    status: PENDING_DOCUMENT
    required_before_golive: true
  - name: ISPE GAMP 5 Computer System Validation
    status: PENDING_DOCUMENT
    required_before_golive: true

rag_collections:
  change_control_regs:
    description: Change control regulatory documents (PENDING)
    min_chunks: 60
    status: pending_ingestion
  capa_procedures:
    description: CAPA procedures and templates (PENDING)
    min_chunks: 30
    status: pending_ingestion

agents:
  - id: capa_inherited
    type: inherited
    base: gmp_ai_copilot_base
    routing_key: capa
  - id: integrity_lims_profile
    type: profile
    base: gmp_ai_copilot_base
    profile_name: integrity_lims_profile
    routing_key: integrity|lims

constraints:
  - no_regulatory_text_fabrication
  - no_product_base_modification
  - no_dangerously_skip_permissions
  - corpus_required_before_golive
  - audit_trail_required_all_endpoints

created_by: layer8_orchestrator
created_at: "2026-06-15"
