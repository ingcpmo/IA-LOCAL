services:
  {{project_id}}_api:
    build: .
    container_name: {{project_id}}_api
    ports:
      - "{{api_port}}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL={{ollama_model}}
      - DATABASE_URL=postgresql://{{project_id}}_user:{{db_password}}@{{project_id}}_postgres:5432/{{project_id}}_db
      - REDIS_URL=redis://{{project_id}}_redis:6379/0
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - AUDIT_LOG_DIR=/app/data/audit_logs
      - GMP_API_KEY=${GMP_API_KEY}
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./knowledge:/app/knowledge
    mem_limit: 768m
    cpus: "1.0"
    restart: unless-stopped
    depends_on:
      {{project_id}}_postgres:
        condition: service_healthy
      {{project_id}}_redis:
        condition: service_healthy
    networks:
      - {{project_id}}_net

  {{project_id}}_postgres:
    image: postgres:16-alpine
    container_name: {{project_id}}_postgres
    ports:
      - "{{postgres_port}}:5432"
    environment:
      - POSTGRES_USER={{project_id}}_user
      - POSTGRES_PASSWORD={{db_password}}
      - POSTGRES_DB={{project_id}}_db
    volumes:
      - {{project_id}}_pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{project_id}}_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {{project_id}}_net

  {{project_id}}_redis:
    image: redis:7-alpine
    container_name: {{project_id}}_redis
    ports:
      - "{{redis_port}}:6379"
    mem_limit: 128m
    cpus: "0.25"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - {{project_id}}_net

networks:
  {{project_id}}_net:
    driver: bridge

volumes:
  {{project_id}}_pgdata:
